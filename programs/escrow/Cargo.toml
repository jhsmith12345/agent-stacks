[package]
name = "agent-stacks-escrow"
version = "0.2.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
custom-heap = []
custom-panic = []

[dependencies]
solana-program = "=4.0.0"
solana-curve25519 = "=4.0.1"
crypto-bigint = { version = "=0.7.10", default-features = false }

[dev-dependencies]
litesvm = "=0.16.0"
solana-address = "~2.6.1"
solana-clock = "~3.1.1"
solana-instruction = "~3.4.0"
solana-keypair = "=3.1.2"
solana-message = "~4.2.4"
solana-signer = "=3.0.1"
solana-transaction = "~4.1.5"
serde_json = "1"
hex = "0.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
